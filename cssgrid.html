<html>
    <head>
        <title>css grid</title>
        <style>
            .parent{
                background-color: rgb(118, 168, 159);
                display:grid;
                grid-template-columns: auto auto auto;
            }
            div{
                background-color: blue;
                padding: 10px;
                margin: 10px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>CSS GRID</h2>
        <div class="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
        </div>
    </body>
</html>
